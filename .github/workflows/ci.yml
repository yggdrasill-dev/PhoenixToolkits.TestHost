name: Build & Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BuildConfiguration: Release

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Restore dependencies
      run: dotnet restore

    - name: Pack
      run: dotnet pack -c ${{ env.BuildConfiguration }} --no-restore PhoenixToolkits.TestHost/PhoenixToolkits.TestHost.csproj

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: nuget
        # A file, directory or wildcard pattern that describes what to upload
        path: |
          PhoenixToolkits.TestHost/bin/${{ env.BuildConfiguration }}/*.nupkg

  push-nuget-package:
    runs-on: self-hosted
    needs: build
    permissions:
      id-token: write        # 允許此 job 取得 GitHub OIDC token（Trusted Publishing 必要）
      actions: read          # download-artifact 抓同 run 的 artifact 用
    steps:
    - name: Download a Build Artifact
      uses: actions/download-artifact@v4
      with:
        # Artifact name
        name: nuget
        # Destination path
        path: nuget

    - name: NuGet login (OIDC → 短期 API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}   # nuget.org 帳號名稱（profile name，非 email）

    - name: push
      run: |
        dotnet nuget push "nuget\**\*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
